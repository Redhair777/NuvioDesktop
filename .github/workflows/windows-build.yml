name: Build Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch real libmpv-2.dll (replace LFS pointer from upstream CDN)
        shell: pwsh
        run: |
          $dllPath = "composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if ((Get-Item $dllPath).Length -lt 1000) {
            Write-Warning "libmpv-2.dll is an LFS pointer ($((Get-Item $dllPath).Length) bytes); downloading real binary from upstream CDN..."
            $url = "https://media.githubusercontent.com/media/NuvioMedia/NuvioDesktop/Dev/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
            Invoke-WebRequest -Uri $url -OutFile $dllPath
          }
          $size = (Get-Item $dllPath).Length
          Write-Host "libmpv-2.dll in working tree: $size bytes"
          if ($size -lt 100000000) {
            Write-Error "libmpv-2.dll in working tree is too small ($size bytes). Expected ~115,320,296."
            exit 1
          }
          Write-Host "PASS: libmpv-2.dll in working tree is valid ($size bytes)"

      - name: Install WebView2 NuGet package
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:USERPROFILE\.nuget\packages"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Inject Supabase config into local.properties
        shell: pwsh
        run: |
          @"
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          "@ | Out-File -FilePath "local.properties" -Encoding utf8

      - name: Clean build outputs and verify DLL propagation
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force composeApp/build/native -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force composeApp/build/compose -ErrorAction SilentlyContinue
          $dll = "composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          $size = (Get-Item $dll).Length
          Write-Host "Pre-build DLL check: $dll is $size bytes"
          if ($size -lt 100000000) { throw "DLL is too small ($size) before build" }

      - name: Build Windows MSI
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: ./gradlew :composeApp:packageReleaseMsi --stacktrace --no-configuration-cache

      - name: Verify libmpv-2.dll inside packaged MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path composeApp/build/compose/binaries/main-release/msi/*.msi, composeApp/build/compose/release-msis/*.msi -File | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI file found for verification"
            exit 1
          }
          Write-Host "Verifying libmpv-2.dll inside MSI: $($msi.FullName) ($($msi.Length) bytes)"
          $extractDir = Join-Path $env:RUNNER_TEMP "msi-verify"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          Write-Host "=== Full 7-Zip extraction output ==="
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$($msi.FullName)" -o"$extractDir" -y -bd 2>&1
          Write-Host "=== Listing all large files (>10MB) in extracted MSI ==="
          Get-ChildItem -Recurse $extractDir | Where-Object { $_.Length -gt 10MB } | Sort-Object Length -Descending | ForEach-Object {
            Write-Host "  $($_.FullName): $($_.Length) bytes"
          }
          Write-Host "=== Searching all sources for libmpv-2.dll in extracted MSI ==="
          Get-ChildItem -Recurse -Filter *.jar $extractDir | ForEach-Object {
            $jar = $_.FullName
            Write-Host "Checking JAR: $($jar) ($($_.Length) bytes)"
            & "$env:ProgramFiles\7-Zip\7z.exe" l "$jar" *libmpv-2.dll 2>&1 | Select-String -Pattern "libmpv-2" | ForEach-Object {
              Write-Host "Found in JAR! $_"
              & "$env:ProgramFiles\7-Zip\7z.exe" x "$jar" -o"$extractDir\jar-out" -y *libmpv-2.dll -bd 2>&1 | Out-Null
            }
          }
          $dllFiles = Get-ChildItem -Recurse -Filter libmpv-2.dll $extractDir
          if (-not $dllFiles) {
            Write-Host "=== Listing ALL extracted files ==="
            Get-ChildItem -Recurse $extractDir | ForEach-Object { Write-Host "  $($_.FullName): $($_.Length) bytes" }
            Write-Error "libmpv-2.dll not found anywhere inside the extracted MSI."
            exit 1
          }
          Write-Host "=== All libmpv-2.dll instances found ==="
          $maxSize = 0
          $maxPath = ""
          foreach ($dll in $dllFiles) {
            $size = $dll.Length
            $loc = if ($dll.FullName -match '\\(jar-out|\.jar)\\') { "inside-JAR" } else { "standalone (appResourcesRootDir)" }
            Write-Host "  $($dll.FullName): $size bytes ($loc)"
            if ($size -gt $maxSize) { $maxSize = $size; $maxPath = $dll.FullName }
          }
          if ($maxSize -ge 100000000) {
            Write-Host "PASS: libmpv-2.dll found at full size ($maxSize bytes) at: $maxPath"
          } else {
            Write-Error "FAIL: Largest libmpv-2.dll found is only $maxSize bytes (expected ~115,320,296). Location: $maxPath"
            exit 1
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-windows-msi
          path: |
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        run: |
          $tag = "win-dev-$((Get-Date).ToString('yyyyMMdd-HHmmss'))"
          $msi = Get-ChildItem -Path composeApp/build/compose/binaries/main-release/msi/*.msi, composeApp/build/compose/release-msis/*.msi -File | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI file found"
            exit 1
          }
          gh release create $tag --target "$env:GITHUB_REF_NAME" --title "Windows dev build $tag" --notes "Development build for Windows testing" --prerelease "$($msi.FullName)"
