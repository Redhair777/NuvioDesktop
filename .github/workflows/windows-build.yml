name: Build Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows MSI
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch real libmpv-2.dll (replace LFS pointer from upstream CDN)
        shell: pwsh
        run: |
          $dllPath = "composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if ((Get-Item $dllPath).Length -lt 1000) {
            Write-Warning "libmpv-2.dll is an LFS pointer ($((Get-Item $dllPath).Length) bytes); downloading real binary from upstream CDN..."
            $url = "https://media.githubusercontent.com/media/NuvioMedia/NuvioDesktop/Dev/composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
            Invoke-WebRequest -Uri $url -OutFile $dllPath
          }
          $size = (Get-Item $dllPath).Length
          Write-Host "libmpv-2.dll in working tree: $size bytes"
          if ($size -lt 100000000) {
            Write-Error "libmpv-2.dll in working tree is too small ($size bytes). Expected ~115,320,296."
            exit 1
          }
          Write-Host "PASS: libmpv-2.dll in working tree is valid ($size bytes)"

      - name: Install WebView2 NuGet package
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:USERPROFILE\.nuget\packages"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Inject Supabase config into local.properties
        shell: pwsh
        run: |
          @"
          NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          "@ | Out-File -FilePath "local.properties" -Encoding utf8

      - name: Clean build outputs and verify DLL propagation
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force composeApp/build/native -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force composeApp/build/compose -ErrorAction SilentlyContinue
          $dll = "composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          $size = (Get-Item $dll).Length
          Write-Host "Pre-build DLL check: $dll is $size bytes"
          if ($size -lt 100000000) { throw "DLL is too small ($size) before build" }

      - name: Build Windows MSI
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: ./gradlew :composeApp:packageReleaseMsi --stacktrace --no-configuration-cache

      - name: Verify libmpv-2.dll inside packaged MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path composeApp/build/compose/binaries/main-release/msi/*.msi, composeApp/build/compose/release-msis/*.msi -File | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI file found for verification"
            exit 1
          }
          Write-Host "MSI: $($msi.FullName) ($($msi.Length) bytes)"
          $expectedHash = "07c68bb211f23a218ded0a36eb12207dc3aeb44e5318ffca6ce9dcc7c3173906"
          $expectedSize = 115320296

          Write-Host "=== STEP 1: SHA256 content verification (7-Zip CAB extraction) ==="
          $cabDir = Join-Path $env:RUNNER_TEMP "msi-cab-extract"
          Remove-Item -Recurse -Force $cabDir -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\7-Zip\7z.exe" x "$($msi.FullName)" -o"$cabDir" -y -bd 2>&1 | Select-Object -Last 3
          $bigFiles = Get-ChildItem -Recurse $cabDir | Where-Object { $_.Length -gt 100MB } | Sort-Object Length -Descending
          if (-not $bigFiles) { Write-Error "FAIL: No >=100MB file in CAB extract"; exit 1 }
          $cabFile = $bigFiles | Sort-Object { [Math]::Abs($_.Length - $expectedSize) } | Select-Object -First 1
          $cabHash = (Get-FileHash -Path $cabFile.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "CAB file: $($cabFile.FullName)"
          Write-Host "Size: $($cabFile.Length) bytes (expect $expectedSize)"
          Write-Host "SHA256: $cabHash"
          Write-Host "Expect: $expectedHash"
          if ($cabFile.Length -ne $expectedSize) { Write-Error "FAIL: CAB size mismatch"; exit 1 }
          if ($cabHash -ne $expectedHash) { Write-Error "FAIL: CAB SHA256 mismatch"; exit 1 }
          Write-Host "PASS: STEP 1 - SHA256 and size match expected values"

          Write-Host "=== STEP 2: msiexec /a admin install (real filenames) ==="
          $adminDir = "C:\msi-admin-extract"
          Remove-Item -Recurse -Force $adminDir -ErrorAction SilentlyContinue
          $p = Start-Process msiexec -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$adminDir`"") -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "FAIL: msiexec /a exited with code $($p.ExitCode)"; exit 1 }
          Start-Sleep -Seconds 5
          $dllPath = Get-ChildItem -Recurse $adminDir -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dllPath) {
            Write-Host "Admin install dir listing:"
            Get-ChildItem -Recurse $adminDir | ForEach-Object { Write-Host "  $($_.FullName): $($_.Length) bytes" }
            Write-Error "FAIL: libmpv-2.dll not found in admin install output"
            exit 1
          }
          $dllHash = (Get-FileHash -Path $dllPath.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Found: $($dllPath.FullName)"
          Write-Host "Size: $($dllPath.Length) bytes (expect $expectedSize)"
          Write-Host "SHA256: $dllHash"
          Write-Host "Expect: $expectedHash"
          if ($dllPath.Length -ne $expectedSize) { Write-Error "FAIL: admin-install size mismatch"; exit 1 }
          if ($dllHash -ne $expectedHash) { Write-Error "FAIL: admin-install SHA256 mismatch"; exit 1 }
          Write-Host "PASS: STEP 2 - libmpv-2.dll found at correct name, size, and hash"

          Write-Host "=== ALL CHECKS PASSED ==="

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-windows-msi
          path: |
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        run: |
          $tag = "win-dev-$((Get-Date).ToString('yyyyMMdd-HHmmss'))"
          $msi = Get-ChildItem -Path composeApp/build/compose/binaries/main-release/msi/*.msi, composeApp/build/compose/release-msis/*.msi -File | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No MSI file found"
            exit 1
          }
          gh release create $tag --target "$env:GITHUB_REF_NAME" --title "Windows dev build $tag" --notes "Development build for Windows testing" --prerelease "$($msi.FullName)"
